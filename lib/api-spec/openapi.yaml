openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sinovera Transit Global API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shipments
    description: Shipment management
  - name: tracking
    description: Tracking events and public tracking
  - name: holds
    description: Package hold management
  - name: customers
    description: Customer management
  - name: users
    description: Staff user management
  - name: warehouses
    description: Warehouse management
  - name: carriers
    description: Carrier management
  - name: cms
    description: CMS content management
  - name: news
    description: News articles
  - name: quotes
    description: Quote requests
  - name: notifications
    description: Notifications
  - name: audit
    description: Audit logs
  - name: dashboard
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      security: [{ clerkAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Shipments ──────────────────────────────────────────────────────────────
  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List shipments
      security: [{ clerkAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: isArchived
          in: query
          schema: { type: boolean }
        - name: isHeld
          in: query
          schema: { type: boolean }
        - name: customerId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of shipments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentListResponse"

    post:
      operationId: createShipment
      tags: [shipments]
      summary: Create a new shipment
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Get shipment by ID
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shipment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
        "404":
          description: Not found

    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdate"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found

    delete:
      operationId: deleteShipment
      tags: [shipments]
      summary: Delete shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /shipments/{id}/archive:
    post:
      operationId: archiveShipment
      tags: [shipments]
      summary: Archive/unarchive a shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveShipmentInput"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}/duplicate:
    post:
      operationId: duplicateShipment
      tags: [shipments]
      summary: Duplicate a shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Duplicated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/generate-tracking-number:
    post:
      operationId: generateTrackingNumber
      tags: [shipments]
      summary: Generate a new tracking number
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Generated tracking number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingNumberResponse"

  /shipments/import:
    post:
      operationId: importShipments
      tags: [shipments]
      summary: Import shipments from JSON array
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  # ── Tracking (public + admin) ───────────────────────────────────────────────
  /track/{trackingNumber}:
    get:
      operationId: trackShipment
      tags: [tracking]
      summary: Public shipment tracking lookup
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingResponse"
        "404":
          description: Shipment not found

  /shipments/{id}/tracking-events:
    get:
      operationId: listTrackingEvents
      tags: [tracking]
      summary: List tracking events for a shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tracking events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackingEvent"

    post:
      operationId: addTrackingEvent
      tags: [tracking]
      summary: Add a tracking event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventInput"
      responses:
        "201":
          description: Created tracking event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingEvent"

  /shipments/{id}/tracking-events/{eventId}:
    patch:
      operationId: updateTrackingEvent
      tags: [tracking]
      summary: Update a tracking event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventUpdate"
      responses:
        "200":
          description: Updated tracking event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingEvent"

    delete:
      operationId: deleteTrackingEvent
      tags: [tracking]
      summary: Delete a tracking event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ── Holds ──────────────────────────────────────────────────────────────────
  /shipments/{id}/holds:
    get:
      operationId: listHolds
      tags: [holds]
      summary: List holds for a shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hold records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hold"

    post:
      operationId: createHold
      tags: [holds]
      summary: Place a shipment on hold
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldInput"
      responses:
        "201":
          description: Hold created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"

  /shipments/{id}/holds/{holdId}:
    patch:
      operationId: updateHold
      tags: [holds]
      summary: Update a hold
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: holdId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldUpdate"
      responses:
        "200":
          description: Updated hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"

  /shipments/{id}/holds/{holdId}/release:
    post:
      operationId: releaseHold
      tags: [holds]
      summary: Release a hold
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: holdId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hold released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"

  # ── Customers ──────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      security: [{ clerkAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"

    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/me:
    get:
      operationId: getMyCustomerProfile
      tags: [customers]
      summary: Get current customer profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found

    patch:
      operationId: updateMyCustomerProfile
      tags: [customers]
      summary: Update current customer profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found

    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /customers/me/saved-shipments:
    get:
      operationId: getMySavedShipments
      tags: [customers]
      summary: Get current customer saved shipments
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Saved shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedShipment"

    post:
      operationId: saveShipment
      tags: [customers]
      summary: Save a shipment to customer account
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveShipmentInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedShipment"

  /customers/me/saved-shipments/{savedId}:
    delete:
      operationId: unsaveShipment
      tags: [customers]
      summary: Remove a saved shipment
      security: [{ clerkAuth: [] }]
      parameters:
        - name: savedId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed

  # ── Users (staff) ──────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List staff users
      security: [{ clerkAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

    post:
      operationId: createUser
      tags: [users]
      summary: Create staff user
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ── Warehouses ─────────────────────────────────────────────────────────────
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      summary: List warehouses
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"

    post:
      operationId: createWarehouse
      tags: [warehouses]
      summary: Create warehouse
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseInput"
      responses:
        "201":
          description: Created warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /warehouses/{id}:
    patch:
      operationId: updateWarehouse
      tags: [warehouses]
      summary: Update warehouse
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

    delete:
      operationId: deleteWarehouse
      tags: [warehouses]
      summary: Delete warehouse
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ── Carriers ───────────────────────────────────────────────────────────────
  /carriers:
    get:
      operationId: listCarriers
      tags: [carriers]
      summary: List carriers
      responses:
        "200":
          description: Carriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Carrier"

    post:
      operationId: createCarrier
      tags: [carriers]
      summary: Create carrier
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarrierInput"
      responses:
        "201":
          description: Created carrier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Carrier"

  /carriers/{id}:
    patch:
      operationId: updateCarrier
      tags: [carriers]
      summary: Update carrier
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarrierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Carrier"

    delete:
      operationId: deleteCarrier
      tags: [carriers]
      summary: Delete carrier
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ── CMS ────────────────────────────────────────────────────────────────────
  /cms:
    get:
      operationId: listCmsContent
      tags: [cms]
      summary: List all CMS content (public)
      responses:
        "200":
          description: CMS content items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsContent"

  /cms/{section}:
    get:
      operationId: getCmsSection
      tags: [cms]
      summary: Get CMS content by section
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Section content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsContent"

    put:
      operationId: upsertCmsSection
      tags: [cms]
      summary: Upsert CMS section content
      security: [{ clerkAuth: [] }]
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsSectionInput"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsContent"

  /cms/{section}/{key}:
    put:
      operationId: upsertCmsItem
      tags: [cms]
      summary: Upsert a single CMS item
      security: [{ clerkAuth: [] }]
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsItemInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsContent"

  # ── News ───────────────────────────────────────────────────────────────────
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List published news articles
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 10 }
        - name: category
          in: query
          schema: { type: string }
        - name: all
          in: query
          description: If true, include unpublished (admin only)
          schema: { type: boolean }
      responses:
        "200":
          description: News articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"

    post:
      operationId: createNewsArticle
      tags: [news]
      summary: Create news article
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsArticleInput"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

  /news/{slug}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get news article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Not found

  /news/{slug}/edit:
    patch:
      operationId: updateNewsArticle
      tags: [news]
      summary: Update news article
      security: [{ clerkAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsArticleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

    delete:
      operationId: deleteNewsArticle
      tags: [news]
      summary: Delete news article
      security: [{ clerkAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ── Quote Requests ─────────────────────────────────────────────────────────
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quote requests
      security: [{ clerkAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteListResponse"

    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a quote request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get quote request
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update quote request (admin)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

  # ── Notifications ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Audit Logs ─────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      security: [{ clerkAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 50 }
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

