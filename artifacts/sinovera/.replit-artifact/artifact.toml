kind = "web"
previewPath = "/"
title = "Sinovera Transit Global"
version = "1.0.0"
id = "artifacts/sinovera"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19952

[services.development]
run = "pnpm --filter @workspace/sinovera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sinovera", "run", "build" ]
serve = "static"
publicDir = "artifacts/sinovera/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19952"
BASE_PATH = "/"
