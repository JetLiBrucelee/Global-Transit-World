kind = "mobile"
previewPath = "/stg-mobile/"
title = "STG Mobile"
version = "1.0.0"
id = "artifacts/stg-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/stg-mobile/" ]
localPort = 24381

[services.development]
run = "pnpm --filter @workspace/stg-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stg-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/stg-mobile", "run", "serve" ]

[services.env]
PORT = "24381"
BASE_PATH = "/stg-mobile/"
