kind = "web"
previewPath = "/admin/"
title = "STG Admin Dashboard"
version = "1.0.0"
id = "artifacts/admin"
router = "path"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 23744

[services.development]
run = "pnpm --filter @workspace/admin run dev"

[services.production]
serve = "static"
publicDir = "artifacts/admin/dist/public"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/admin", "run", "build"]

[services.production.build.env]
PORT = "23744"
BASE_PATH = "/admin/"
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23744"
BASE_PATH = "/admin/"
